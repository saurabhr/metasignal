name: Pylint

on:
  push:
    paths:
      - "src/**/*.py"
      - ".github/workflows/pylint.yml"
  pull_request:
    paths:
      - "src/**/*.py"
      - ".github/workflows/pylint.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install package and pylint
        run: uv sync --extra docs --dev && uv pip install pylint

      - name: Run pylint on library source
        run: uv run pylint src/ --fail-under=8
