site_name: metasignal
site_description: Python interface for Signal Detection Theory (SDT) and meta-measures analysis
site_author: Saurabh Ranjan
repo_name: saurabhr/metasignal
repo_url: https://github.com/saurabhr/metasignal
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.select

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            docstring_section_style: google
  - include-markdown
  - mkdocs-jupyter:
      # mkdocs-jupyter sniffs every *.md file with jupytext.read() to check
      # for notebook frontmatter, which runs a MyST/markdown-it parser over
      # the content. That parser treats mkdocstrings' "::: module.func"
      # autodoc syntax as an unclosed MyST colon-fence div (MyST also uses
      # ":::" to open/close container blocks), spamming spurious "Div ...
      # unclosed ... closing implicitly" warnings on every mkdocstrings page.
      # None of our notebooks are stored in .md format, so excluding *.md
      # here avoids the sniff entirely with no loss of functionality.
      ignore: ["*.md"]
      execute: false
      include_source: true
      ignore_h1_titles: true

markdown_extensions:
  - mkdocs-click

exclude_docs: |
  tutorials/rm.txt

nav:
  - Home: index.md
  - User's Guide:
      - Installation: installation.md
      - Usage: usage.md
  - Tutorials:
      - Overview: tutorials/index.md
      - 1. Getting Started: tutorials/01_getting_started.ipynb
      - 2. Computing All 26 Measures: tutorials/02_computing_measures.ipynb
      - 3. Statistical Inference: tutorials/03_statistical_inference.ipynb
      - 4. Difficulty Dependence: tutorials/04_difficulty_dependence.ipynb
      - 5. Metacognitive Bias: tutorials/05_metacognitive_bias.ipynb
      - 6. Split-Half Reliability: tutorials/06_split_half_reliability.ipynb
      - 7. Bayesian Hierarchical Meta-d': tutorials/07_bayesian_hierarchical.ipynb
  - API Reference: api.md
  - SDT Bayes: sdtbayes.md
  - CLI Reference: cli.md
  - Contributing: contributing.md
  - Future Development: roadmap.md
  - Changelog: changelog.md
