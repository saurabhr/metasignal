site_name: metasignal
site_description: Python interface for Signal Detection Theory (SDT) and meta-measures analysis
site_author: Saurabh Ranjan
repo_name: saurabhr/metasignal
repo_url: https://github.com/saurabhr/metasignal
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.select

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            docstring_section_style: google
  - include-markdown

markdown_extensions:
  - mkdocs-click

exclude_docs: |
  conf.py

nav:
  - Home: index.md
  - User's Guide:
    - Installation: installation.md
    - Usage: usage.md
  - Tutorials:
    - Overview: tutorials/index.md
    - 1. Getting Started: tutorials/getting_started.md
    - 2. Computing All 20 Measures: tutorials/computing_measures.md
    - 3. Statistical Inference: tutorials/statistical_inference.md
    - 4. Difficulty Dependence: tutorials/difficulty_dependence.md
    - 5. Metacognitive Bias: tutorials/metacognitive_bias.md
    - 6. Split-Half Reliability: tutorials/split_half_reliability.md
  - API Reference: api.md
  - MATLAB to Python Mapping: matlab_to_python_mapping.md
  - CLI Reference: cli.md
  - Changelog: changelog.md
